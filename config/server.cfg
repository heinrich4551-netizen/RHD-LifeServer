// RHD-LifeServer - Arma 3 dedicated server configuration
// Replace placeholder values before production use.

hostname = "RHD LifeServer | Altis Life RP";
password = "";
passwordAdmin = "CHANGE_ME_ADMIN_PASSWORD";
serverCommandPassword = "CHANGE_ME_COMMAND_PASSWORD";

maxPlayers = 64;
verifySignatures = 2;
requiredBuild = 0;

motd[] = {
    "Welcome to RHD LifeServer",
    "Altis Life Roleplay",
    "SimplePersist Player Persistence",
    "Respect RP | Drive safe | Have fun"
};
motdInterval = 15;

voteMissionPlayers = 1;
voteThreshold = 2;

kickDuplicate = 1;
allowedFilePatching = 0;

persistent = 1;
forceRotorLibSimulation = 0;

// Required Steam Workshop dependency:
// SimplePersist - Toakan-Network / Tom Daykin
// Workshop ID: 3006691432
// Workshop: https://steamcommunity.com/sharedfiles/filedetails/?id=3006691432
// Start the server with @SimplePersist installed, in addition to @RHD-LifeServer.

// Logging
logFile = "server.log";
timeStampFormat = "short";

// BattlEye
BattlEye = 1;

// Network tuning. Adjust to host capacity and player count.
MaxMsgSend = 256;
MaxSizeGuaranteed = 512;
MaxSizeNonguaranteed = 256;
MinBandwidth = 131072;
MaxBandwidth = 104857600;
MaxPacketSize = 1400;

// Mission rotation. Keep the mission name aligned with the installed framework mission.
class Missions
{
    class RHD_AltisLife
    {
        template = "Altis_Life.Altis";
        difficulty = "Regular";
    };
};

class AdvancedOptions
{
    LogMemory = 1;
    SkipDescriptionParsing = 0;
    IgnoreSecureID = 0;
    BattlEyeLogFile = "battleye.log";
};
